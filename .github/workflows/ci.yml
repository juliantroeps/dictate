name: CI

on:
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: brew install swiftlint

      - name: Toolchain id
        id: toolchain
        run: echo "id=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Lint
        run: swiftlint lint --strict

      - name: Format lint
        run: swift format lint --configuration .swiftformat -r Sources Tests
